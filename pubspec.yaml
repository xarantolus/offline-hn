name: offline_hn
description: "An offline-first Hacker News reader."
publish_to: 'none'
version: 0.4.3+9

environment:
  sdk: ^3.13.1

dependencies:
  crypto: ^3.0.7
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  path: ^1.9.1
  page_capture:
    path: packages/page_capture
  path_provider: ^2.1.6
  pool: ^1.5.3
  sqlite3: ^3.7.0
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  json_annotation: ^4.12.0
  html: ^0.15.7
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  flutter_inappwebview: 6.2.0-beta.3
  scrollable_positioned_list: ^0.3.8
  package_info_plus: ^10.2.2
  animations: ^3.0.0
  linkify: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  fake_async: ^1.3.3
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: tool/icon/legacy.png
  adaptive_icon_background: "#FF6600"
  adaptive_icon_foreground: tool/icon/foreground.png
  adaptive_icon_monochrome: tool/icon/monochrome.png
  remove_alpha_ios: false
