[package]
name = "page_capture_adblock"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
base64 = "0.22"
jni = "0.21.1"
serde_json = "1"

[profile.dev]
opt-level = 3
debug = false
strip = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
