name: page_capture
description: Saves web pages as web archives with a headless WebView and opens them offline.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  build_runner: ^2.16.2

flutter:
  assets:
    - assets/adblock/
    - assets/autoconsent/
    - assets/filters/
  plugin:
    platforms:
      android:
        package: io.github.xarantolus.page_capture
        pluginClass: PageCapturePlugin
